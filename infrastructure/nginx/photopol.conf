server {
    listen 80;
    server_name www.photopol.us;
    return 301 https://photopol.us$request_uri;
}

server {
    listen 80;
    server_name photopol.us;
    return 301 https://photopol.us$request_uri;
}

server {
    listen 443 ssl http2;
    server_name photopol.us;

    # ssl_certificate /etc/letsencrypt/live/photopol.us/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/photopol.us/privkey.pem;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
